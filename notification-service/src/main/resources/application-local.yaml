server:
  port: ${SERVER_PORT:9002}

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      # Los deserializadores (String + ErrorHandlingDeserializer/JSON) los define KafkaConsumerConfig.

notification:
  mail:
    from: ${MAIL_FROM:noreply@pharmaflow.local}
    app-name: ${MAIL_APP_NAME:PharmaFlow}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  kafka:
    topics:
      auth-events: ${KAFKA_TOPIC_AUTH_EVENTS:auth.user.events}

eureka:
  instance:
    instance-id: ${spring.application.name}(${INSTANCE_HOSTNAME:localhost}):${server.port}
    hostname: ${INSTANCE_HOSTNAME:localhost}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE_GLOBAL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    build:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.netflix.eureka: INFO
    com.netflix.eureka: INFO
    org.springframework.kafka: INFO
    com.pharmaflow: DEBUG
