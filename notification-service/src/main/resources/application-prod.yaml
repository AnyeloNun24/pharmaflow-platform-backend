server:
  port: ${SERVER_PORT}

spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    # Conexion segura al broker: TLS + autenticacion SASL. Las credenciales se inyectan por entorno
    # (KAFKA_SASL_JAAS_CONFIG); nunca van en el repositorio. Aplica al consumer y al productor del DLT.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      # Los deserializadores (String + ErrorHandlingDeserializer/JSON) los define KafkaConsumerConfig.

notification:
  mail:
    from: ${MAIL_FROM}
    app-name: ${MAIL_APP_NAME:PharmaFlow}
    frontend-base-url: ${FRONTEND_BASE_URL}

eureka:
  instance:
    instance-id: ${spring.application.name}(${INSTANCE_HOSTNAME}):${server.port}
    hostname: ${INSTANCE_HOSTNAME}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE_GLOBAL}

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
    build:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.netflix.eureka: WARN
    com.netflix.eureka: WARN
    org.springframework.kafka: WARN
    com.pharmaflow: INFO
