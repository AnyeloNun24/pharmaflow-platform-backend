# Config exclusiva de tests: sombrea src/main/resources/application.yaml.
# Apunta al broker de Kafka embebido y desactiva integraciones externas (Eureka, SMTP real).
spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: notification-service-test
      auto-offset-reset: earliest
  mail:
    host: localhost
    port: 3025

notification:
  channel: email
  mail:
    from: noreply@pharmaflow.test
    app-name: PharmaFlow
    frontend-base-url: http://localhost:4200
  kafka:
    topics:
      auth-events: auth.user.events

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    org.springframework.kafka: WARN
    com.pharmaflow: DEBUG
